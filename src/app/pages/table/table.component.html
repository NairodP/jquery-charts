<div class="table-test-container">
  <p class="page-intro">
    100 posts JSONPlaceholder joints avec 10 users, colonne lazy Commentaires, export CSV,
    Group By, recherche, sélection et préférences persistantes.
  </p>

  <jquery-table
    [config]="tableConfig"
    [data]="tableData"
    [isLoading]="isLoading"
    (rowSelected)="onRowSelected($event)"
    (sortChange)="onSortChange($event)"
    (pageChange)="onPageChange($event)"
    (searchChange)="onSearchChange($event)"
    (groupByChange)="onGroupByChange($event)"
    (columnsChange)="onColumnsChange($event)"
  ></jquery-table>

  <div class="code-demo">
    <div class="code-block">
      <h3>Template</h3>
      <pre><code [textContent]="tableTemplateCode"></code></pre>

      <h3>Configuration</h3>
      <pre><code [textContent]="tableConfigCode"></code></pre>

      <h3>Data</h3>
      <pre><code [textContent]="tableDataCode"></code></pre>
    </div>
  </div>
</div>
